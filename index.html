<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime Fighter | Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b19;color:#fff;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:16px}h1{font-style:italic;letter-spacing:3px;margin:8px 0;color:#ffd45b}p{color:#bac7e0}canvas{width:100%;height:auto;display:block;background:#101a32;border:2px solid #405174;box-shadow:0 16px 60px #0008}button,select{background:#263a64;color:white;border:1px solid #6d85b0;border-radius:6px;padding:9px 13px;cursor:pointer}button:hover{background:#36558e}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}.hint{font-size:13px;line-height:1.7}.tag{color:#ffd45b}#error{color:#ff8080}</style></head><body><main><h1>ANIME FIGHTER <small style="font-size:12px;color:#90a8d4">ALPHA 0.1</small></h1><div class="bar"><button id="start">INICIAR / REINICIAR</button><button id="mode">MODO: CPU</button><button id="pause">PAUSAR</button><label>Personagem P1 <select id="char1"><option value="0">AKIRA</option><option value="1">REI</option><option value="2">KAI</option></select></label><label>P2 <select id="char2"><option value="1">REI</option><option value="0">AKIRA</option><option value="2">KAI</option></select></label></div><div id="stage"></div><p class="hint"><span class="tag">P1:</span> A/D mover · W pular · S agachar · F soco · G chute · H especial · R defender. <span class="tag">P2 local:</span> ←/→ mover · ↑ pular · ↓ agachar · J soco · K chute · L especial · I defender. Espaço pausa. Primeiro a vencer 2 rounds. Sem agarrões.</p><p id="error"></p></main><script src="https://cdn.jsdelivr.net/npm/pixi.js@8.10.2/dist/pixi.min.js"></script><script>
(async()=>{
const W=960,H=540,FLOOR=437,GRAV=.68,MAXTIME=99;let app;
try{app=new PIXI.Application();await app.init({width:W,height:H,background:0x111a32,antialias:true});document.getElementById('stage').appendChild(app.canvas)}catch(e){document.getElementById('error').textContent='Falha ao iniciar PixiJS: '+e.message;return}
const world=new PIXI.Container(),hud=new PIXI.Container(),fx=new PIXI.Container();app.stage.addChild(world,fx,hud);
const keys=new Set(),pressed=new Set();window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(!keys.has(e.code))pressed.add(e.code);keys.add(e.code)});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();pressed.clear()});
const profiles=[{name:'AKIRA',color:0xffc453,accent:0xd44945},{name:'REI',color:0x67c9ed,accent:0x4a59a8},{name:'KAI',color:0x9de58d,accent:0x7255c6}];
const layouts=[{left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS',punch:'KeyF',kick:'KeyG',special:'KeyH',block:'KeyR'},{left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown',punch:'KeyJ',kick:'KeyK',special:'KeyL',block:'KeyI'}];
let mode='cpu',state='select',paused=false,frame=0,time=MAXTIME,round=1,wins=[0,0],fighters=[],particles=[],shake=0,notice='ESCOLHA OS LUTADORES',noticeUntil=Infinity,roundWait=0;
const bg=new PIXI.Graphics();world.addChild(bg);
function drawBG(){bg.clear();bg.rect(0,0,W,H).fill(0x16243f);bg.rect(0,300,W,145).fill(0x2b3753);bg.circle(760,110,80).fill({color:0xffd590,alpha:.18});for(let i=0;i<12;i++){let x=i*100-20;bg.rect(x,225+(i%3)*16,72,220).fill(0x18213b);for(let j=0;j<4;j++)bg.rect(x+12,250+j*37,12,14).fill({color:0xffd78c,alpha:.4})}bg.rect(0,FLOOR,W,H-FLOOR).fill(0x30384b);bg.rect(0,FLOOR,W,5).fill(0xe5a95b);for(let x=0;x<W;x+=80)bg.moveTo(x,FLOOR).lineTo(x-55,H).stroke({color:0x57617b,width:2,alpha:.45})}drawBG();
const g1=new PIXI.Graphics(),g2=new PIXI.Graphics(),hudg=new PIXI.Graphics();world.addChild(g1,g2);hud.addChild(hudg);
const txt=(value,x,y,size=20,color=0xffffff,anchor=.5)=>{let t=new PIXI.Text({text:value,style:{fontFamily:'Arial',fontSize:size,fontWeight:'900',fill:color,stroke:{color:0x111529,width:4}}});t.anchor.set(anchor,.5);t.position.set(x,y);hud.addChild(t);return t};
const leftName=txt('',24,29,20,0xffffff,0),rightName=txt('',W-24,29,20,0xffffff,1),clock=txt('99',W/2,49,40,0xffd45b),center=txt('PRESSIONE INICIAR',W/2,178,35,0xffdb72),roundText=txt('',W/2,95,16),combo=txt('',W/2,132,18,0xffb45b);
function fighter(id,profile,x){return{id,p:profiles[profile],x,y:FLOOR,vx:0,vy:0,face:id===0?1:-1,hp:100,meter:0,stun:0,guard:0,attack:null,attackFrame:0,hitTargets:new Set(),crouch:false,ground:true,combo:0,comboTimer:0,aiCooldown:0}}
function start(){wins=[0,0];round=1;beginRound()}
function beginRound(){fighters=[fighter(0,+document.getElementById('char1').value,270),fighter(1,+document.getElementById('char2').value,690)];time=MAXTIME;roundWait=85;state='fight';paused=false;frame=0;notice='ROUND '+round;noticeUntil=80;particles=[];g1.clear();g2.clear()}
function attack(f,type){if(f.stun>0||f.attack||f.guard||!f.ground)return;let data={punch:[7,5,12,8,75,6,2],kick:[11,7,17,13,100,10,4],special:[17,10,26,17,155,16,12]}[type];if(type==='special'&&f.meter<35)return;if(type==='special')f.meter-=35;f.attack={type,start:data[0],active:data[1],total:data[2],damage:data[3],reach:data[4],stun:data[5],push:data[6]};f.attackFrame=0;f.hitTargets.clear()}
function input(f,layout){let l=layout;f.crouch=keys.has(l.down)&&f.ground;f.guard=keys.has(l.block)&&f.ground&&!f.attack;let dir=(keys.has(l.right)?1:0)-(keys.has(l.left)?1:0);if(f.stun>0)dir=0;f.vx=dir*(f.crouch?1.1:3.25);if(pressed.has(l.up)&&f.ground&&f.stun<=0&&!f.crouch){f.vy=-12.8;f.ground=false}if(pressed.has(l.punch))attack(f,'punch');else if(pressed.has(l.kick))attack(f,'kick');else if(pressed.has(l.special))attack(f,'special')}
function cpu(f,enemy){f.aiCooldown--;let d=enemy.x-f.x,dist=Math.abs(d);f.crouch=false;f.guard=false;f.vx=0;if(f.stun>0)return;if(enemy.attack&&dist<enemy.attack.reach+65&&f.aiCooldown<=0){f.guard=Math.random()<.78;f.aiCooldown=15}if(dist>105)f.vx=Math.sign(d)*2.5;else if(dist<55)f.vx=-Math.sign(d)*1.6;if(dist<155&&!f.attack&&f.aiCooldown<=0){attack(f,Math.random()<.16&&f.meter>=35?'special':Math.random()<.55?'punch':'kick');f.aiCooldown=24+Math.random()*35}if(dist>180&&Math.random()<.003&&f.ground){f.vy=-12.8;f.ground=false}}
function spark(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=2+Math.random()*7;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*12,color})}}
function hit(att,def){let a=att.attack;if(!a||att.hitTargets.has(def.id))return;let forward=(def.x-att.x)*att.face;if(forward<0||forward>a.reach)return;let height=Math.abs(att.y-def.y);if(height>72)return;att.hitTargets.add(def.id);let blocked=def.guard&&def.ground&&def.face===-att.face;let damage=blocked?Math.ceil(a.damage*.18):a.damage;def.hp=Math.max(0,def.hp-damage);def.stun=blocked?9:a.stun;def.vx=att.face*(blocked?2.8:a.push);def.vy=blocked?0:-1.7;att.meter=Math.min(100,att.meter+(blocked?4:9));def.meter=Math.min(100,def.meter+4);att.combo=att.comboTimer>0?att.combo+1:1;att.comboTimer=65;shake=blocked?3:7;spark(def.x,def.y-68,blocked?0x7bcaff:0xffd377,blocked?9:20)}
function update(){if(pressed.has('Space'))paused=!paused;if(state!=='fight'||paused){pressed.clear();return}frame++;if(roundWait>0){roundWait--;pressed.clear();return}if(frame%60===0)time=Math.max(0,time-1);let a=fighters[0],b=fighters[1];input(a,layouts[0]);if(mode==='cpu')cpu(b,a);else input(b,layouts[1]);for(let f of fighters){if(f.stun>0)f.stun--;if(f.comboTimer>0)f.comboTimer--;else f.combo=0;if(f.attack){f.attackFrame++;if(f.attackFrame>=f.attack.start&&f.attackFrame<f.attack.start+f.attack.active)hit(f,fighters[1-f.id]);if(f.attackFrame>=f.attack.total)f.attack=null}f.x+=f.vx;f.y+=f.vy;if(!f.ground)f.vy+=GRAV;if(f.y>=FLOOR){f.y=FLOOR;f.vy=0;f.ground=true}f.x=Math.max(42,Math.min(W-42,f.x))}if(Math.abs(a.x-b.x)<63&&Math.abs(a.y-b.y)<75){let centerX=(a.x+b.x)/2;a.x=centerX-31.5;a.x=Math.max(42,a.x);b.x=centerX+31.5;b.x=Math.min(W-42,b.x)}a.face=a.x<b.x?1:-1;b.face=-a.face;for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life--}particles=particles.filter(p=>p.life>0);shake*=.82;if(a.hp<=0||b.hp<=0||time===0){let winner=a.hp===b.hp?-1:a.hp>b.hp?0:1;if(winner>=0)wins[winner]++;notice=winner<0?'EMPATE':fighters[winner].p.name+' VENCEU!';noticeUntil=Infinity;state='result';setTimeout(()=>{if(state!=='result')return;if(wins.some(v=>v>=2)){state='over';notice=winner<0?'FIM DE JOGO':fighters[winner].p.name+' É CAMPEÃO!'}else{round++;beginRound()}},2200)}pressed.clear()}
function drawFighter(f,g){g.clear();let bob=f.ground?Math.sin(frame*.13)*1.5:0,baseY=f.y+bob;g.ellipse(f.x,FLOOR+7,42,9).fill({color:0x030711,alpha:.42});let body=f.p.color,accent=f.p.accent;let crouch=f.crouch?28:0,stun=f.stun>0&&frame%5<2;g.rect(f.x-22,baseY-89+crouch,44,56).fill(stun?0xffffff:body);g.rect(f.x-19,baseY-130+crouch,38,39).fill(0xf4c6a5);g.poly([f.x-24,baseY-127+crouch,f.x-10,baseY-145+crouch,f.x+22,baseY-134+crouch,f.x+24,baseY-121+crouch]).fill(accent);g.rect(f.x-20,baseY-34,16,34).fill(0x1b2645);g.rect(f.x+5,baseY-34,16,34).fill(0x1b2645);g.rect(f.x-26,baseY-4,24,8).fill(accent);g.rect(f.x+4,baseY-4,24,8).fill(accent);let reach=f.attack?Math.min(f.attack.reach*.62,86):30;let active=f.attack&&f.attackFrame>=f.attack.start&&f.attackFrame<f.attack.start+f.attack.active;g.rect(f.x+f.face*14-(f.face<0?reach:0),baseY-84+crouch,reach,15).fill(active?0xffe3a0:accent);g.rect(f.x-f.face*24-(f.face>0?15:0),baseY-80+crouch,15,39).fill(accent);if(f.guard){g.arc(f.x+f.face*22,baseY-80,48,-1.1,1.1,f.face<0).stroke({color:0x83dfff,width:5,alpha:.85})}if(active&&f.attack.type==='special'){g.circle(f.x+f.face*95,baseY-82,22).fill({color:0xffe099,alpha:.7});g.circle(f.x+f.face*95,baseY-82,35).stroke({color:0xff9c43,width:5,alpha:.6})}}
function render(){drawFighter(fighters[0]||fighter(0,0,270),g1);drawFighter(fighters[1]||fighter(1,1,690),g2);fx.removeChildren().forEach(c=>c.destroy());for(let p of particles){let g=new PIXI.Graphics();g.circle(p.x,p.y,Math.max(1,p.life/7)).fill(p.color);fx.addChild(g)}world.x=(Math.random()-.5)*shake;world.y=(Math.random()-.5)*shake;hudg.clear();const a=fighters[0],b=fighters[1];for(let i=0;i<2;i++){let f=fighters[i],x=i===0?24:W-424;hudg.roundRect(x,47,400,24,4).fill(0x101523);if(f){let width=396*f.hp/100;hudg.roundRect(i===0?x+2:x+398-width,49,width,20,3).fill(f.hp<25?0xe04b53:0xf1bf58);hudg.roundRect(x,78,220,10,3).fill(0x142039);hudg.roundRect(x,78,220*f.meter/100,10,3).fill(0x65d6f6)}}leftName.text=a?a.p.name:'AKIRA';rightName.text=b?b.p.name:'REI';clock.text=String(time);roundText.text='ROUND '+round+'  |  '+wins[0]+' - '+wins[1];center.text=(state==='select'||state==='result'||state==='over'||frame<noticeUntil)?notice:paused?'PAUSADO':'';combo.text=a&&a.combo>1?a.combo+' HIT COMBO':b&&b.combo>1?b.combo+' HIT COMBO':''}
app.ticker.add(()=>{update();render()});document.getElementById('start').onclick=start;document.getElementById('mode').onclick=e=>{mode=mode==='cpu'?'local':'cpu';e.target.textContent='MODO: '+(mode==='cpu'?'CPU':'2 JOGADORES')};document.getElementById('pause').onclick=()=>paused=!paused;render();
})();
</script></body></html>
