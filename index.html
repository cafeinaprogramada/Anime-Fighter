 if(menuPage==='title'){html='<div class="titleScreen"><div class="titleBurst"></div><div class="titleEyebrow">BREADS ON FIRE · PRESENTS</div><div class="titleLogo">BREADS ON FIRE<br><em>BRAVE FIGHTERS</em></div><div class="titleSlash"></div><div class="titlePress">'+(gamePrefs.lang==='en'?'PRESS ENTER TO START':gamePrefs.lang==='es'?'PULSA ENTER PARA COMENZAR':'PRESSIONE ENTER PARA COMEÇAR')+'</div><div class="titleHint">© BREADS ON FIRE · PROTOTYPE V3.3</div></div><button class="titleClick" data-action="enterTitle" aria-label="ENTER"></button>'}
 else if(menuPage==='home'){html=heading('MENU PRINCIPAL','ESCOLHA SEU PRÓXIMO DESAFIO')+'<div class="menuGrid">'+tile(t('play'),'PLAYER VS PLAYER · PLAYER VS CPU · CPU VS CPU','play','big')+tile(t('settings'),'GRÁFICOS · IDIOMA · TECLAS','settings','side')+tile(t('comic'),'FLIPTRU · BREADS ON FIRE','comic')+tile('TUTORIAL','GUIA DE COMBATE · WIKI','tutorial')+'</div>'}
 else if(menuPage==='tutorial'){
 const topics={basics:['FUNDAMENTOS','VENÇA DOIS ROUNDS PARA CONQUISTAR A PARTIDA. GERENCIE SUA STAMINA E CONTROLE A DISTÂNCIA.'],movement:['MOVIMENTAÇÃO','P1: A / D PARA ANDAR E W PARA PULAR. P2: SETAS PARA ANDAR E PULAR. TOQUE DUAS VEZES NA DIREÇÃO PARA EXECUTAR UM DASH.'],attacks:['ATAQUES','P1: F SOCO, G CHUTE, H GOLPE FORTE, J ESPECIAL. P2: U SOCO, I CHUTE, O GOLPE FORTE, L ESPECIAL. CADA GOLPE TEM CUSTO E RECUPERAÇÃO.'],defense:['DEFESA E STAMINA','P1: R DEFENDE. P2: P DEFENDE. BLOQUEAR CONSOME STAMINA; A GUARDA PODE SER QUEBRADA. A STAMINA SE RECUPERA QUANDO VOCÊ DESCANSA.'],fighters:['PERSONAGENS','WESLEY USA PROJÉTEIS DE FOGO. CHIP USA SALTOS EXTRAS, MERGULHO E CAMPO RADIANTE. JEFREY USA FOCO RELÂMPAGO PARA ACELERAR. VERTONAL USA A TRÍADE SONORA, COM TRÊS NOTAS MUSICAIS DIRECIONAIS.'],modes:['MODOS DE JOGO','PLAYER VS PLAYER: DOIS JOGADORES LOCAIS. PLAYER VS CPU: ENFRENTE A IA. CPU VS CPU: ASSISTA AO COMBATE.'],options:['CONFIGURAÇÕES','ENTER DURANTE A LUTA ABRE A PAUSA. AJUSTE GRÁFICOS, CONSULTE OS COMANDOS E RETORNE À PARTIDA. REMAPEAMENTO DISPONÍVEL NO MENU PRINCIPAL.']};
 const topic=topics[wikiTopic]||topics.basics;
 html=heading('TUTORIAL','WIKI · GUIA DE COMBATE')+'<div class="wikiLayout"><div class="wikiNav">'+Object.entries(topics).map(([id,v])=>tile(v[0],'','wiki:'+id)).join('')+'</div><article class="wikiArticle"><h3>'+topic[0]+'</h3><p>'+topic[1]+'</p><h3>COMO NAVEGAR</h3><p>SETAS: NAVEGAR · ENTER: CONFIRMAR · ESC: VOLTAR</p></article></div>'+tile(t('back'),'','back','wide');
 }
 else if(menuPage==='mode'){html=heading(t('mode'),'01 / 04')+'<div class="menuCards">'+tile('PLAYER VS PLAYER','2 JOGADORES LOCAIS','mode:local')+tile('PLAYER VS CPU','DESAFIO CONTRA IA','mode:cpu')+tile('CPU VS CPU','ASSISTIR AO COMBATE','mode:cpu-cpu')+'</div>'+tile(t('back'),'','back','wide')}
 else if(menuPage==='p1'||menuPage==='p2'){
 const side=menuPage==='p1'?0:1,other=chars.find(c=>c.id===selected[1-side]);
 const panel=(name,skill,right,active)=>'<div class="fighterPanel '+(right?'right':'')+'" '+(active?'id="activeFighter"':'')+'><div class="fighterPortrait">ARTE FUTURA<br>DO PERSONAGEM</div><h3>'+name+'</h3><p>'+skill+'</p></div>';
 const slots=chars.map(c=>'<button type="button" class="rosterSlot" data-character="'+c.id+'" data-action="char:'+c.id+'">'+c.name.slice(0,3)+'</button>').join('')+'<button type="button" class="rosterSlot" data-character="random" data-action="char:random">?</button>'+Array.from({length:Math.max(0,8-chars.length-1)},()=>'<button class="rosterSlot" disabled>✦</button>').join('');
 html=heading(t(menuPage),'0'+(side+2)+' / 04 · SELECIONE SEU PERSONAGEM')+'<div class="fighterSelect">'+panel(side===0?'P1':other?.name||'P1',side===0?'HABILIDADE':other?.special||'HABILIDADE',false,side===0)+'<div class="rosterCenter"><div class="rosterHint">◈ '+t(menuPage)+' ◈</div><div class="rosterGrid">'+slots+'</div><div class="rosterHint">SETAS · ENTER · ESC</div></div>'+panel(side===1?'P2':other?.name||'P2',side===1?'HABILIDADE':other?.special||'HABILIDADE',true,side===1)+'</div>'+tile(t('back'),'','back','wide');
 }
 else if(menuPage==='stage'){html=heading(t('stage'),'04 / 04')+'<div class="menuCards">'+tile('ROOFTOP','CIDADE · DISPONÍVEL','stage:rooftop')+Array.from({length:4},(_,i)=>tile('STAGE '+(i+2),'EM BREVE','', 'locked')).join('')+'</div><div class="menuSettings"><div class="menuSetting"><label>'+t('time')+'</label><select data-setting="time"><option value="60">60</option><option value="99">99</option><option value="180">180</option><option value="-1">∞</option></select></div><div class="menuSetting"><label>VELOCIDADE DE ENERGIA</label><select data-setting="staminaSpeed"><option value="slow">LENTA · -10%</option><option value="regular">REGULAR</option><option value="fast">RÁPIDA · +10%</option></select></div><div class="menuSetting"><label>'+t('difficulty')+'</label><select data-setting="difficulty"><option value="easy">EASY</option><option value="normal">NORMAL</option><option value="hard">HARD</option></select></div></div>'+tile(t('ready'),'','fight','wide')+tile(t('back'),'','back','wide')}
 else if(menuPage==='settings'||menuPage==='pauseSettings'){html=heading(t('settings'),'BENTO · PERFORMANCE · PERSONALIZAÇÃO')+'<div class="menuSettings">'+[['language',t('language'),[['pt','PORTUGUÊS BR'],['en','ENGLISH'],['es','ESPAÑOL']]],['particles',t('particles'),[['true','ON'],['false','OFF']]],['afterimages',t('afterimages'),[['true','ON'],['false','OFF']]],['shake',t('shake'),[['true','ON'],['false','OFF']]],['debug','DEBUG · HITBOXES', [['false','OFF'],['true','ON']]],['quality','QUALIDADE', [['high','HIGH'],['low','LOW']]]].map(([key,label,opts])=>'<div class="menuSetting"><label>'+label+'</label><select data-setting="'+key+'">'+opts.map(([v,n])=>'<option value="'+v+'">'+n+'</option>').join('')+'</select></div>').join('')+(menuPage==='settings'?'<div class="menuSetting"><label>'+t('controls')+'</label><button data-action="remap">'+t('controls')+'</button></div>':'')+'</div>'+tile(t('back'),'','back','wide')}
 else if(menuPage==='remap'||menuPage==='commands'){html=heading(menuPage==='remap'?t('controls'):t('commands'),'P1 / P2 · KEYBOARD')+'<div class="menuSettings">'+control.map((c,i)=>Object.entries(c).map(([key,code])=>'<div class="menuSetting"><label>P'+(i+1)+' · '+key.toUpperCase()+'</label><button data-action="'+(menuPage==='remap'?'bind:'+i+':'+key:'noop')+'">'+code.replace('Key','').replace('Arrow','ARROW ')+'</button></div>').join('')).join('')+'</div><div class="menuInfo">A/D · MOVE | W · JUMP | R · GUARD | F · PUNCH | G · KICK | H · HEAVY | J · SPECIAL<br>DOUBLE TAP · DASH | CHIP · AIR HOP / DIVE | JEFREY · LIGHTNING FOCUS</div>'+tile(t('back'),'','back','wide')}
 else if(menuPage==='pause'){html=heading(t('pause'),'ENTER · OPTIONS')+'<div class="menuGrid">'+tile(t('resume'),'','resume','big')+tile(t('settings'),'','pauseSettings','side')+tile(t('commands'),'','commands')+tile(t('restart'),'','restart')+tile(t('select'),'','selection')+tile(t('home'),'','home','wide')+'</div>'}
 else if(menuPage==='victory'){html=heading(t('victory'),announced)+'<div class="menuGrid">'+tile(t('rematch'),'','rematch','big')+tile(t('select'),'','selection','side')+tile(t('home'),'','home','wide')+'</div>'}
 menuContent.innerHTML=html;
 menuContent.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>activateMenu(el.dataset.action)));
 menuContent.querySelectorAll('select[data-setting]').forEach(el=>{const key=el.dataset.setting;el.value=key==='time'?String(gamePrefs.roundTime):key==='difficulty'?document.getElementById('difficulty').value:String(gamePrefs[key]);el.addEventListener('change',()=>setMenuOption(key,el.value))});
 focusMenu(0)
}
function setMenuOption(key,value){if(key==='time')gamePrefs.roundTime=Number(value);else if(key==='difficulty')document.getElementById('difficulty').value=value;else if(key==='language'){gamePrefs.lang=value;renderMenu()}else{gamePrefs[key]=value==='true'?true:value==='false'?false:value;if(key==='debug')debug=!!gamePrefs.debug;if(key==='particles'&&!gamePrefs.particles){particles.length=0;particleGraphics.clear();for(const e of vfxEmitters)e.em.emit=false}if(key==='afterimages'&&!gamePrefs.afterimages)afterimageLayer.removeChildren().forEach(x=>x.destroy());if(key==='quality'&&value==='low'){gamePrefs.particles=false;particles.length=0;particleGraphics.clear()} }try{localStorage.setItem('animeFighterPrefs',JSON.stringify(gamePrefs));localStorage.setItem('animeFighterControls',JSON.stringify(control))}catch(e){}}
function activateMenu(action){if(!action||action==='noop')return;
 if(action.startsWith('wiki:')){wikiTopic=action.slice(5);renderMenu();return}
 if(action==='tutorial'){menuSwap('tutorial');return}
 if(action==='comic'){window.open('https://fliptru.com.br/comic/breads-on-fire','_blank','noopener');return}
 if(action==='enterTitle'){menuSwap('home');return}
 if(action==='play'||action==='selection'){if(action==='selection')endCombatSession();menuSwap('mode');return}
 if(action==='settings'||action==='pauseSettings'||action==='commands'||action==='remap'){menuReturn=menuPage;menuSwap(action);return}
 if(action==='back'){menuSwap(menuPage==='p2'?'p1':menuPage==='p1'?'mode':menuPage==='stage'?'p2':menuPage==='remap'?menuReturn:menuPage==='commands'||menuPage==='pauseSettings'?menuReturn:'home');return}
 if(action==='home'){endCombatSession();menuSwap('home');return}
 if(action==='resume'){hideGamePanel();return}
 if(action==='restart'||action==='rematch'){endCombatSession();startBattleIntro();return}
 if(action==='fight'){startBattleIntro();return}
 if(action.startsWith('mode:')){matchType=action.split(':')[1];mode=matchType;menuSwap('p1');return}
 if(action.startsWith('char:')){const c=action.split(':')[1],side=menuPage==='p1'?0:1;selected[side]=c==='random'?chars[Math.floor(Math.random()*chars.length)].id:c;document.getElementById(side?'char2':'char1').value=selected[side];menuSwap(side?'stage':'p2');return}
 if(action.startsWith('stage:')){selectedStage=action.split(':')[1];gamePrefs.stage=selectedStage;return}
 if(action.startsWith('bind:')){const [,i,key]=action.split(':');remapTarget=[Number(i),key];const el=choices()[menuFocus];if(el)el.textContent='PRESS KEY…';return}
}
function startBattleIntro(){if(menuBusy)return;menuBusy=true;menuWipe.classList.add('closed');setTimeout(()=>{
 menuWipe.classList.remove('closed');menuContent.style.display='none';battleIntro.classList.add('active');
 document.getElementById('emberField').innerHTML=Array.from({length:18},(_,i)=>'<i class="ember" style="--x:'+(4+i*5.4)+'%;--size:'+(3+i%4*2)+'px;--duration:'+(2.2+i%5*.7)+'s;--delay:-'+(i*.27)+'s;--drift:'+(i%2?35:-35)+'px"></i>').join('');
 document.getElementById('versusNames').innerHTML=(document.getElementById('char1').value+' <span>VS</span> '+document.getElementById('char2').value).toUpperCase();
 setTimeout(()=>{menuWipe.classList.add('closed');setTimeout(()=>{battleIntro.classList.remove('active');menuContent.style.display='';start();hideGamePanel();menuWipe.classList.remove('closed');menuBusy=false},250)},3600)
 },250)}
window.addEventListener('keydown',e=>{
 if(remapTarget){e.preventDefault();e.stopImmediatePropagation();if(e.code!=='Escape'){control[remapTarget[0]][remapTarget[1]]=e.code;setMenuOption('quality',gamePrefs.quality)}remapTarget=null;renderMenu();return}
 if(e.code==='Enter'&&!menuVisible&&phase==='fight'){e.preventDefault();showGamePanel('pause');held.clear();return}
 if(!menuVisible)return;
 if(['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Enter','Space','Escape'].includes(e.code)){e.preventDefault();e.stopImmediatePropagation()}
 if(e.repeat)return;
 if(e.code==='ArrowDown'||e.code==='ArrowRight'){focusMenu(menuFocus+1)}
 else if(e.code==='ArrowUp'||e.code==='ArrowLeft'){focusMenu(menuFocus-1)}
 else if(e.code==='Enter'||e.code==='Space'){if(menuPage==='title'){activateMenu('enterTitle');return}const el=choices()[menuFocus];if(el){if(el.tagName==='SELECT'){const values=Array.from(el.options);el.selectedIndex=(el.selectedIndex+1)%values.length;el.dispatchEvent(new Event('change'))}else el.click()}}
 else if(e.code==='Escape'){if(menuPage==='home')menuSwap('title');else activateMenu(menuPage==='pause'?'resume':'back')}
},true);
try{const prefs=JSON.parse(localStorage.getItem('animeFighterPrefs')||'null');if(prefs)Object.assign(gamePrefs,prefs);const keys=JSON.parse(localStorage.getItem('animeFighterControls')||'null');if(Array.isArray(keys)&&keys.length===2)for(let i=0;i<2;i++)for(const k of Object.keys(control[i]))if(typeof keys[i]?.[k]==='string')control[i][k]=keys[i][k]}catch(e){}
debug=!!gamePrefs.debug;renderMenu();
let acc=0;app.ticker.add(t=>{acc+=Math.min(t.deltaMS,100);let n=0;while(acc>=1000/FPS&&n++<4){update();acc-=1000/FPS}render();drawFeedback()});document.getElementById('start').onclick=()=>{try{window.speechSynthesis?.cancel()}catch(e){}start()};document.getElementById('mode').onclick=e=>{mode=mode==='cpu'?'local':'cpu';e.target.textContent='MODO: '+(mode==='cpu'?'CPU':'2 JOGADORES')};document.getElementById('debug').onclick=e=>{debug=!debug;e.target.textContent='HITBOXES: '+(debug?'ON':'OFF')};document.getElementById('pause').onclick=()=>paused=!paused;render();
})();
</script></body></html>
